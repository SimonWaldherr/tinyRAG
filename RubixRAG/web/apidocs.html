<!doctype html>
<html lang="de" data-theme="rubix">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R3 API-Dokumentation (OpenAPI / Swagger)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2050%2050'%3E%3Cpolygon%20points='13,1%2037,1%2049,13%2049,37%2037,49%2013,49%201,37%201,13'%20fill='none'%20stroke='%23f5c400'%20stroke-width='2.8'/%3E%3Cline%20x1='14'%20y1='10'%20x2='43'%20y2='41'%20stroke='%23f5c400'%20stroke-width='7'%20stroke-linecap='round'/%3E%3Cline%20x1='43'%20y1='10'%20x2='14'%20y2='41'%20stroke='%23f5c400'%20stroke-width='7'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
  /* Page-specific layout only — colors/fonts/theme all come from
     style.css's CSS variables so this page matches whichever theme
     (dark/light/ocean/rubix) is active in the main app, since both are
     served from the same origin and read the same r3_theme localStorage
     key (see the inline script at the end of <head>). */
  /* style.css's shared `body { height: 100%; overflow: hidden }` is meant
     for the main SPA shell, whose sidebar + <main> panels each manage their
     own internal scroll region — but this page is a plain, long, top-to-
     bottom document with no such inner scroll container, so inheriting
     that rule (this page links the same stylesheet, for theme colors only)
     silently clipped everything past one viewport height with no way to
     scroll. Overriding back to the ordinary "grow with content, let the
     document scroll" behavior here, since this <style> block loads after
     the stylesheet <link> above and wins on equal specificity. */
  body { max-width: 980px; margin: 0 auto; padding: 24px 20px 64px; background: var(--bg); color: var(--text); height: auto; overflow: visible; }
  a { color: var(--accent); }
  header.docs-head { margin-bottom: 24px; }
  header.docs-head h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header.docs-head p { color: var(--muted); margin: 4px 0; }
  .docs-links { margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; }
  .apikey-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 24px; }
  .apikey-bar label { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
  .apikey-bar input { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; min-width: 260px; font-family: monospace; }
  .apikey-bar .hint { color: var(--muted); font-size: 0.85rem; }
  #endpoints { display: flex; flex-direction: column; gap: 14px; }
  .endpoint { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .endpoint > summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; list-style: none; }
  .endpoint > summary::-webkit-details-marker { display: none; }
  .method-badge { font-weight: 700; font-size: 0.8rem; padding: 3px 9px; border-radius: 5px; color: var(--accent-fg); min-width: 58px; text-align: center; }
  .method-get { background: var(--success); }
  .method-post { background: var(--accent); }
  .method-put, .method-patch { background: #d68a1f; }
  .method-delete { background: var(--danger); }
  .endpoint-path { font-family: monospace; font-size: 0.95rem; }
  .endpoint-summary { color: var(--muted); font-size: 0.9rem; }
  .endpoint-body { padding: 4px 16px 18px; border-top: 1px solid var(--border); }
  .endpoint-body h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 8px; }
  .security-badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .security-badge { font-size: 0.78rem; background: var(--accent-dim); color: var(--accent-h); border-radius: 12px; padding: 2px 10px; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  table.schema-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.schema-table th, table.schema-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  table.schema-table code { background: var(--sb-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .response-block { margin-bottom: 10px; }
  .status-code { font-family: monospace; font-weight: 700; }
  .status-2xx { color: var(--success); }
  .status-4xx, .status-5xx { color: var(--danger); }
  textarea.try-body { width: 100%; min-height: 90px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 0.85rem; padding: 8px; box-sizing: border-box; }
  .try-controls { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
  .try-controls button { background: var(--accent); color: var(--accent-fg); border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer; font-weight: 600; }
  .try-controls button:hover { background: var(--accent-h); }
  .try-result { margin-top: 8px; }
  .try-result pre { background: var(--sb-bg); border: 1px solid var(--sb-border); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 0.82rem; white-space: pre-wrap; word-break: break-word; }
  #loadError { color: var(--danger); }
</style>
<script>
  // Match whichever theme the main app is set to (same origin, same
  // localStorage) — see web/app.js's applyTheme/resolveTheme for the
  // canonical version this mirrors just enough of.
  (function () {
    var choice = "rubix";
    try { choice = localStorage.getItem("r3_theme") || "rubix"; } catch (e) {}
    if (choice === "auto") {
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      choice = prefersDark ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", choice);
  })();
</script>
</head>
<body>
  <header class="docs-head">
    <h1 id="apiTitle">R3 API-Dokumentation</h1>
    <p id="apiDescription"></p>
    <div class="docs-links">
      <a href="/">← Zurück zur Anwendung</a>
      <a href="/api/openapi.json" target="_blank" rel="noopener">Rohe OpenAPI-Spec (JSON)</a>
      <a href="https://editor.swagger.io/?url=" id="externalEditorLink" target="_blank" rel="noopener">In Swagger Editor öffnen</a>
    </div>
  </header>

  <div class="apikey-bar">
    <label>X-API-Key <input id="apiKeyInput" type="text" placeholder="nur nötig, falls settings.api.require_api_key aktiv ist"></label>
    <span class="hint">Wird bei „Ausprobieren" als Header mitgeschickt. Admin-Endpunkte (🔒) funktionieren stattdessen nur, wenn in diesem Browser bereits eine Admin-Sitzung aktiv ist.</span>
  </div>

  <p id="loadError" role="alert" hidden></p>
  <div id="endpoints" aria-live="polite"></div>

<script src="/apidocs.js"></script>
</body>
</html>
